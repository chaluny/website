<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pine Economics - Coming Soon</title>
    <meta name="description" content="Pine Economics - Transport economics analysis and consulting. Sign up to stay updated.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pine-dark: #386641;
            --pine-medium: #6A994E;
            --pine-light: #A7C957;
            --cream: #F2E8CF;
            --accent: #BC4749;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;;
            background-color: var(--cream);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            text-align: center;
            align-items: center;
            max-width: 500px;
            width: 100%;
            display: flex;           
            flex-direction: column;  
            align-items: center;     
        }

        .logo {
            width: 500px;
            height: 500px;
            margin: 0 auto 0rem;
            display: block;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .signup-form {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.4);
            padding: 1.5rem 1.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(56, 102, 65, 0.1);
            border: 1px solid rgba(167, 201, 87, 0.2);
        }

        .form-title {
            font-size: 1.2rem;
            color: var(--pine-dark);
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .email-input {
            width: 80%;
            padding: 0.5rem 0.75rem;
            border: 2px solid var(--pine-light);
            border-radius: 50px;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            transition: border-color 0.3s ease;
            background: var(--cream);
        }

        .email-input:focus {
            outline: none;
            border-color: var(--pine-medium);
        }

        .email-input::placeholder {
            color: rgba(56, 102, 65, 0.6);
        }

        .submit-button {
            background-color: #C2FBD7;
            border-radius: 50px;
            border-width: 0;
            box-shadow: rgba(25, 25, 25, 0.04) 0 0 1px 0, rgba(0, 0, 0, 0.1) 0 3px 4px 0;
            color: #008000;
            cursor: pointer;
            display: inline-block;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 1em;
            height: 50px;
            padding: 0 15px;
            transition: all 200ms;
        }

        .submit-button:hover {
            background-color: #AFE6C3;
            transform: scale(1.05);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .success-message {
            display: none;
            background: var(--pine-light);
            color: white;
            padding: 1rem;
            border-radius: 10px;
            margin-top: 1rem;
            font-weight: 500;
        }
        .coming-soon {
            margin-bottom: 2rem;
            color: var(--pine-dark);
        }

        .coming-soon h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0.5rem 0 2rem 0;
            color: var(--accent);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 900;
        }

        .coming-soon p {
            font-size: 1.2rem;
            color: var(--pine-medium);
            margin-bottom: 0;
        }
        
        /* Responsive Design */
        @media (max-width: 600px) {
            .logo {
                width: 450px;
                height: 450px;
                margin-bottom: 2rem;
            }

            .signup-form {
                padding: 1rem 1.5rem;
            }

            .form-title {
                font-size: 1.2rem;
            }
            .coming-soon h1 {
                font-size: 2rem;
                font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                font-weight: 900;
            }
    
            .coming-soon p {
                font-size: 1rem;
            }

            body {
                padding: 1rem;
            }
        }

        @media (max-width: 400px) {
            .logo {
                width: 290px;
                height: 290px;
            }
        }

        /* Subtle animation */
/* Hide elements initially and set up animations */
            .logo {
                opacity: 0;
                animation: fadeIn 0.8s ease-in-out 0.1s forwards;
            }

            .coming-soon {
                opacity: 0;
                animation: fadeIn 0.8s ease-in-out 0.3s forwards;
            }

            .signup-form {
                opacity: 0;
                animation: fadeIn 0.8s ease-in-out 0.5s forwards;
        }

        /* Animation keyframes */
        @keyframes fadeIn {
            from {
            opacity: 0;
            transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <a href = "index3.html"><img src="images/logo_full.png" alt="Pine Economics Logo"></a> 
        </div>
        <div class="coming-soon">
            <h1>Coming Soon</h1>
        </div>

        <form class="signup-form" id="emailForm" netlify>
            <!-- <h1 class="form-title">Keep me posted</h1> -->
            
            <input 
                type="email" 
                class="email-input" 
                placeholder="Enter your email address"
                required
                id="emailInput"
                name="email"
            >
            
            <button type="submit" class="submit-button">
                Sign up for updates
            </button>
            
            <div class="success-message" id="successMessage">
                Thanks! We'll keep you updated on our latest insights.
            </div>
        </form>
    </div>

    <script>
        document.getElementById('emailForm').addEventListener('submit', function(e) {
                // Don't prevent default - let Netlify handle it
            const emailInput = document.getElementById('emailInput');
            const email = emailInput.value.trim();
    
            // Basic validation
            if (!email || !email.includes('@')) {
                e.preventDefault();
                alert('Please enter a valid email address');
                return;
            }
    
            // Track the submission (optional)
            console.log('Email submitted:', email);
    
            // Let the form submit normally to Netlify
            });
            
            // Show loading state
            submitButton.textContent = 'Signing up...';
            submitButton.disabled = true;
            
            // Simulate form submission (replace with actual form handling)
            setTimeout(() => {
                // Hide form elements and show success
                emailInput.style.display = 'none';
                submitButton.style.display = 'none';
                successMessage.style.display = 'block';
                
                // Here you would typically send the email to your backend
                console.log('Email submitted:', email);
                
                // Optional: You can integrate with services like:
                // - Netlify Forms
                // - Mailchimp
                // - ConvertKit
                // - Your own backend
                
            }, 1000);
        });
    </script>
</body>
</html>
